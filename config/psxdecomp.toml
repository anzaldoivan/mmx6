# config/psxdecomp.toml — adopted by /psxdecomp:upgrade (the repository predates psxdecomp).

[psxdecomp]
version = "0.6.0"
profile = "psx"
bootstrapped = "adopted 2026-10-04"

[pa3]
version = "3.14.2"
tag = "v3.14.2"
sha = "0ccf0dfaf95e36435ec1b7e58f3be3f863acb19b"

[refs]
file = "config/refs.toml"
index = "docs/ops/refs.md"

[deviations]
list = ["adopted: not bootstrapped by psxdecomp; pins recorded as found"]

[public]
repo = "anzaldoivan/mmx6"
dev_branch = "main"
checks = ["build SLUS_013.95", "public-clean audit (no game bytes)"]
private_repo = "anzaldoivan/mmx6-private"
private_rev = "663823a6092aa89df5617ffce0cfc88dca313db2"   # the -private commit CI reads
image = "ghcr.io/anzaldoivan/mmx6-toolchain@sha256:b7a668ec23e399f54824019f503476225b294f9a106c8839b4e4fe2fc2caf811"
land_check = ["bash", "tools/docker/land_check.sh", "{tree}"]

# [own]: what this repository holds itself in place of a psxdecomp delivery. psxdecomp writes nothing for a key
# set here; /psxdecomp:doctor checks that its path exists.
[own]
gate = "make fleet"
toolchain = "make toolchain-check"
campaign = "docs/ops/campaign.md"

# [kit]: psxdecomp's kit pin of 2026-09-30 (compat.toml). The kit's install record here names no commit.
[kit]
digest = "sha256:581f5ec0553b8c9119fca08ebb3b863caeb3bb2c1e5039402aa67f403ce6e748"
repo = "https://github.com/anzaldoivan/BFM-decomp.git"
sha = "898aeb324d557ae3c5c672ef08bdbbc3db080962"

# [psyq]: the PsyQ release the game links, from psxdecomp's psyq.toml (seen 2026-10-01). A lead for phase 1.4;
# the pin is phase 1.4's finding and lives in the repo's compiler-pin record.
[psyq]
stamp = "470"
version = "4.7"
ships_compiler = "no"
cc1_banner = ""
aspsx = ""
old_gcc = ""
confidence = "measured"
status = "lead — never the pin"

# [host]: the host recipe of the machine that builds (docs/ops/mmx6-hosts.md).
[host]
recipe = "macos-arm64"

