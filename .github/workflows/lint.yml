# .github/workflows/lint.yml -- code style CI (docs/STYLE.md). No game data.
#   * clang-format (blocking): the pinned 18.1.3 (the build image's version) reformats src/ exactly as `make format`;
#     any diff fails the job.
#   * stylecheck (report-only): tools/mmx6/stylecheck.py S1, S3-S6; never fails the job.
name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: clang-format and stylecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
      - name: install clang-format 18.1.3
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          clang-format --version
          clang-format --version | grep -F '18.1.3'
      - name: clang-format (same command as make format), then no diff
        run: |
          find src -type f \( -name '*.c' -o -name '*.h' \) -not -name '.*' -print0 | xargs -0 -r clang-format -i --style=file
          git diff --exit-code
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: stylecheck self-test (report-only)
        continue-on-error: true
        run: python tools/mmx6/stylecheck.py --self-test
      - name: stylecheck (report-only)
        continue-on-error: true
        run: python tools/mmx6/stylecheck.py
